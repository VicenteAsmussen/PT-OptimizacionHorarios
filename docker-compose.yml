services:
  postgres:
    image: postgres:16-alpine
    container_name: horarios_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: horarios_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - horarios_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: horarios_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - horarios_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: horarios_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      CI: "true"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/horarios_db
      CLIENT_URL: http://localhost:5173
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      - postgres
    networks:
      - horarios_net

volumes:
  postgres_data:
  pgadmin_data:
  backend_node_modules:

networks:
  horarios_net:
    driver: bridge
